version: "3.9"

services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -r backend/requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./:/app
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend
